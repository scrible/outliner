services:
  - type: web
    name: scrible-outliner
    runtime: static
    repo: https://github.com/bwthomas/outliner
    buildCommand: npm install --legacy-peer-deps && npm run build -- --configuration production
    staticPublishPath: dist/outliner/browser
    envVars:
      - key: NODE_VERSION
        value: "18.19.1"
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
